<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Girlfriend's Day ❤️</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@600;700&family=Great+Vibes&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ========================= -->
    <!-- STAR BACKGROUND -->
    <!-- ========================= -->

    <div id="stars"></div>

    <div id="moon"></div>

    <div id="shooting-stars"></div>



    <!-- ========================= -->
    <!-- INTRO SECTION -->
    <!-- ========================= -->

    <section id="intro">

        <div id="intro-container">

            <div id="cursor">|</div>

            <h1 id="intro-text"></h1>

            <p id="tap-message">
                Tap anywhere to begin ❤️
            </p>

        </div>

    </section>



    <!-- ========================= -->
    <!-- STORY SECTION -->
    <!-- ========================= -->

    <section id="story">

        <div class="story-container">

            <h2 id="storyText"></h2>

        </div>

    </section>



    <!-- ========================= -->
    <!-- TITLE REVEAL -->
    <!-- ========================= -->

    <section id="titleReveal">

        <div class="title-container">

            <h1 id="girlfriendDay">

                Happy
                <br>
                Girlfriend's Day

            </h1>

            <h2 id="aaratrika">

                Aaratrika

            </h2>

            <p id="scrollHint">

                ↓ Scroll Slowly ↓

            </p>

        </div>

    </section>



    <!-- ========================= -->
    <!-- AUDIO -->
    <!-- ========================= -->

    <audio id="bgMusic" loop>

        <source src="assets/music/intro.mp3" type="audio/mpeg">

    </audio>



    <!-- ========================= -->
    <!-- SCRIPT -->
    <!-- ========================= -->

    <script src="script.js"></script>

</body>
</html>
