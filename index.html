<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Girlfriend's Day ❤️</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@600;700&family=Great+Vibes&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ===================================================== -->
    <!-- CANVAS NIGHT SKY -->
    <!-- ===================================================== -->

    <canvas id="sky"></canvas>

    <!-- ===================================================== -->
    <!-- MOON -->
    <!-- ===================================================== -->

    <div id="moon"></div>

    <!-- ===================================================== -->
    <!-- SHOOTING STARS -->
    <!-- ===================================================== -->

    <div id="meteorContainer"></div>

    <!-- ===================================================== -->
    <!-- INTRO -->
    <!-- ===================================================== -->

    <section id="intro">

        <div id="introBox">

            <div id="cursor">|</div>

            <div id="typewriter"></div>

            <div id="tapAnywhere">

                Tap anywhere to begin ❤️

            </div>

        </div>

    </section>

    <!-- ===================================================== -->
    <!-- STORY -->
    <!-- ===================================================== -->

    <section id="story">

        <div class="storyWrapper">

            <div id="storyLine"></div>

        </div>

    </section>

    <!-- ===================================================== -->
    <!-- TITLE REVEAL -->
    <!-- ===================================================== -->

    <section id="titleReveal">

        <div id="titleWrapper">

            <h1 id="title">

                Happy
                <br>
                Girlfriend's Day

            </h1>

            <h2 id="name">

                Aaratrika

            </h2>

            <div id="scrollText">

                ↓ Scroll Slowly ↓

            </div>

        </div>

    </section>
<!-- ========================= -->
<!-- CHAPTER 2 -->
<!-- ========================= -->

<section id="chapter2">

    <div class="chapter2-text">

        <h2 id="chapter2Typing"></h2>

    </div>

<div class="chapter2-image">

    <div class="polaroid">

        <img src="images/aaratrika.png" id="girlImage">

        <p class="caption">My favourite person ❤️</p>

    </div>

</div>

</section>
    <!-- ===================================================== -->
    <!-- MUSIC -->
    <!-- ===================================================== -->

    <audio id="music" loop>

        <source src="assets/music/intro.mp3" type="audio/mpeg">

    </audio>

    <script src="script.js"></script>

</body>

</html>
